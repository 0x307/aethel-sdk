[package]
name = "aethel-sdk"
version = "0.8.1"
edition = "2021"
description = "Ergonomic Rust SDK over aethel-core's post-quantum identity primitives: generate, sign, verify, project, recover"
authors = ["Ed Johnson"]
license = "Apache-2.0"
repository = "https://github.com/0x307/aethel-sdk"
documentation = "https://docs.rs/aethel-sdk"
homepage = "https://0x307.com/crates"
keywords = ["post-quantum", "identity", "sdk", "cryptography"]
categories = ["cryptography"]
readme = "README.md"
# 1.95, not the 1.85 floor the rest of the initiative holds. wasmtime is a real
# dependency here, not test tooling, and it requires 1.95. Embedding a
# WebAssembly runtime is the reason, and declaring a floor this crate cannot
# actually meet would be worse than declaring a higher one.
rust-version = "1.95"

# The compiled component ships inside the package: it is embedded, not fetched
# at install time. core/ must therefore be in the published crate, alongside the
# hash and the pin that say which aethel-core revision produced it.
include = [
    "src/**/*",
    "build.rs",
    "tests/**/*",
    # The README tells the reader to run these. Leaving them out of the package
    # meant a crates.io reader was pointed at a `cargo run --example` that could
    # not work from what they installed.
    "examples/**/*",
    "core/**/*",
    "scripts/sync-core.sh",
    "scripts/check-pqc-sig-features.sh",
    # The comparison check and its allowlist ship too. SECURITY-MODEL.md points
    # at them as the enforcement behind the timing claim, and a claim you cannot
    # inspect from the package you installed is worth less.
    "scripts/check-comparisons.sh",
    "scripts/allowed-comparisons.txt",
    "README.md",
    "CHANGELOG.md",
    "SECURITY-MODEL.md",
    "LICENSE",
    "NOTICE",
]

[lib]
name = "aethel_sdk"

[features]
# Credentials (SAAP selective disclosure) are OFF by default and should not be
# relied on. aethel-core's SECURITY.md records that the credential commitment
# does not hide what it commits to: a presentation reveals every attribute it
# carries, disclosed or not. The feature keeps the credential API compiling and
# tested so that work can continue in public. It is not for production use.
experimental-credentials = []

# Credential tests and the presentation benchmark only exist with the feature.
[[test]]
name = "disclosure"
required-features = ["experimental-credentials"]

[[example]]
name = "bench_verify"
required-features = ["experimental-credentials"]

[dependencies]
# A digest over the embedded artifact, to detect a substituted component. This
# is an integrity check, not a cryptographic operation of the identity protocol:
# no crypto is implemented in this crate, by charter. The primitives live in the
# component.
sha2 = "0.10"

# Algorithm-labelled public keys and signatures, including the canonical W3C
# Multikey and transport encodings. Keep cryptographic implementation features
# off: aethel-core's embedded component remains this SDK's only crypto engine.
pqc-sig = { version = "0.5", default-features = false, features = ["std"] }

# Wiping this crate's copy of the entropy passed into key generation. The secret
# itself is never here, but the input that determines it briefly is.
zeroize = { version = "1.7", default-features = false, features = ["alloc"] }
subtle = "2.6.1"

# wasmtime is a HOST runtime: it needs mmap and cannot compile for
# wasm32-unknown-unknown. Scoping it away from wasm32 keeps this crate buildable
# for a browser target, which is what P6 will need. aethel-core learned this the
# expensive way; the scoping is copied deliberately.
# Reading the OS CSPRNG to seed key generation. Not a cryptographic operation
# this crate implements, and it has to happen above L1: the component has no
# WASI and therefore no ambient randomness.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.getrandom]
version = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "48.0.1", default-features = false, features = ["runtime", "component-model", "cranelift"] }

# The execution proof compares the component against aethel-core's native API at
# the same pinned revision. It is a dev-dependency: this crate never calls
# aethel-core directly at runtime, it calls the component.
#
# `rev` MUST equal the one in core/pin.toml, or the proof compares the vendored
# component against a different revision's native API while claiming otherwise.
# scripts/sync-core.sh rewrites pin.toml and not this line, so they drifted once
# already; the_dev_dependency_matches_the_vendored_revision in
# tests/embedded_artifact.rs now fails if they disagree.
#
# `version` matters only at publish time: cargo drops the git source when
# packaging and resolves this requirement against crates.io, so a stale one
# fails `cargo publish` long after the local build stopped caring.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aethel-core = { version = "0.7", git = "https://github.com/0x307/aethel-core", rev = "b98fe074975fdba822c3827c46a92090e59ea914" }

[dev-dependencies]
# Independent Multibase decoder used by tests/multikey.rs.
multibase = "0.9"
