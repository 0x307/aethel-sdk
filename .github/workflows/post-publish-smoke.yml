name: Post-publish smoke

on:
  workflow_dispatch:
    inputs:
      published_version:
        description: Exact aethel-sdk version confirmed available on crates.io (for example, 0.8.0)
        required: true
        type: string
      release_tag:
        description: Matching manually pushed release tag (for example, v0.8.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  published-default-feature-identity-lifecycle:
    name: published default-feature identity lifecycle
    runs-on: ubuntu-latest
    steps:
      # This checkout is metadata-only: it obtains the source hash recorded at
      # the supplied release tag. The consumer itself is created by the script
      # in a new temporary directory, with a fresh Cargo home.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag, version, and tagged component hash
        id: release
        env:
          PUBLISHED_VERSION: ${{ inputs.published_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] ||
            { echo "::error::published_version must be an exact Cargo package version"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] ||
            { echo "::error::release_tag contains unsupported characters"; exit 1; }
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git diff --quiet "$RELEASE_TAG" HEAD ||
            { echo "::error::checkout does not identify the supplied release tag"; exit 1; }
          tag_version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          [[ "$tag_version" == "$PUBLISHED_VERSION" ]] ||
            { echo "::error::release tag declares $tag_version, not $PUBLISHED_VERSION"; exit 1; }
          expected=$(git show "$RELEASE_TAG:core/component.sha256" | awk 'NF { print $1; exit }')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::core/component.sha256 at $RELEASE_TAG is missing or malformed"; exit 1; }
          echo "expected_component_sha256=$expected" >> "$GITHUB_OUTPUT"

      - name: Exercise the crates.io consumer outside this checkout
        run: |
          set -euo pipefail
          scripts/post-publish-smoke.sh \
            "${{ inputs.published_version }}" \
            "${{ steps.release.outputs.expected_component_sha256 }}"
