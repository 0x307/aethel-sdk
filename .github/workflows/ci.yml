name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets
      - run: cargo test
      # The README quickstart is kept as an example and run here, so a broken
      # quickstart fails CI rather than a reader's first five minutes.
      - run: cargo run --example quickstart

  comparisons:
    name: no unreviewed equality in src/
    runs-on: ubuntu-latest
    # aethel-core does constant-time comparison in ct_verify.rs. This crate is
    # not allowed to undo that with a plain == on a signature, a proof, or key
    # material. The check freezes the reviewed set of comparisons in src/ and
    # fails on anything new, so each one is a decision rather than a diff
    # nobody looked twice at. The self-test runs first: a check that has never
    # been shown to fail is not known to work.
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-comparisons.sh --self-test
      - run: scripts/check-comparisons.sh

  wasm32:
    name: wasm32 still builds
    runs-on: ubuntu-latest
    # wasmtime is a host runtime and cannot compile for wasm32-unknown-unknown.
    # It is scoped away from that target so this crate stays buildable for a
    # browser, which P6 needs. Adding wasmtime broke the wasm32 build in
    # aethel-core, so the scoping gets a job rather than a comment.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
